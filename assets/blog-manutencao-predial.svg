<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Ilustração de um prédio com calendário de manutenção e checklist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="tower2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#022c22" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- círculos de fundo -->
  <circle cx="1080" cy="90" r="230" fill="#10b981" opacity=".14"/>
  <circle cx="90" cy="600" r="260" fill="#10b981" opacity=".12"/>
  <circle cx="620" cy="-40" r="150" fill="#5eead4" opacity=".08"/>

  <!-- chão -->
  <rect x="0" y="548" width="1200" height="82" fill="#022c22" opacity=".35"/>

  <!-- prédio ao fundo -->
  <g filter="url(#sh)">
    <rect x="150" y="260" width="190" height="290" rx="10" fill="url(#tower2)"/>
    <g fill="#ecfdf5" opacity=".9">
      <rect x="174" y="290" width="38" height="30" rx="5"/><rect x="278" y="290" width="38" height="30" rx="5"/>
      <rect x="174" y="346" width="38" height="30" rx="5"/><rect x="278" y="346" width="38" height="30" rx="5"/>
      <rect x="174" y="402" width="38" height="30" rx="5"/><rect x="278" y="402" width="38" height="30" rx="5"/>
      <rect x="174" y="458" width="38" height="30" rx="5"/><rect x="278" y="458" width="38" height="30" rx="5"/>
    </g>
    <rect x="226" y="490" width="38" height="60" rx="6" fill="#065f46"/>
  </g>

  <!-- prédio principal -->
  <g filter="url(#sh)">
    <rect x="330" y="130" width="270" height="420" rx="14" fill="url(#tower)"/>
    <rect x="330" y="130" width="270" height="34" rx="14" fill="#34d399"/>
    <rect x="330" y="150" width="270" height="14" fill="#34d399"/>
    <g fill="#10b981">
      <rect x="362" y="196" width="46" height="38" rx="6"/><rect x="442" y="196" width="46" height="38" rx="6"/><rect x="522" y="196" width="46" height="38" rx="6"/>
      <rect x="362" y="262" width="46" height="38" rx="6"/><rect x="442" y="262" width="46" height="38" rx="6"/><rect x="522" y="262" width="46" height="38" rx="6"/>
      <rect x="362" y="328" width="46" height="38" rx="6"/><rect x="442" y="328" width="46" height="38" rx="6"/><rect x="522" y="328" width="46" height="38" rx="6"/>
      <rect x="362" y="394" width="46" height="38" rx="6"/><rect x="522" y="394" width="46" height="38" rx="6"/>
    </g>
    <!-- janela acesa -->
    <rect x="442" y="262" width="46" height="38" rx="6" fill="#fde68a"/>
    <!-- porta -->
    <rect x="442" y="468" width="46" height="82" rx="8" fill="#065f46"/>
    <circle cx="478" cy="512" r="3.5" fill="#a7f3d0"/>
    <rect x="428" y="452" width="74" height="10" rx="5" fill="#059669"/>
  </g>

  <!-- prédio à direita -->
  <g filter="url(#sh)">
    <rect x="590" y="330" width="150" height="220" rx="10" fill="url(#tower2)"/>
    <g fill="#ecfdf5" opacity=".9">
      <rect x="612" y="358" width="34" height="28" rx="5"/><rect x="684" y="358" width="34" height="28" rx="5"/>
      <rect x="612" y="408" width="34" height="28" rx="5"/><rect x="684" y="408" width="34" height="28" rx="5"/>
      <rect x="612" y="458" width="34" height="28" rx="5"/><rect x="684" y="458" width="34" height="28" rx="5"/>
    </g>
  </g>

  <!-- cartão calendário / checklist -->
  <g filter="url(#sh)" transform="translate(770 88)">
    <rect width="330" height="410" rx="26" fill="#ffffff"/>
    <rect width="330" height="78" rx="26" fill="#059669"/>
    <rect y="52" width="330" height="26" fill="#059669"/>
    <rect x="52" y="-14" width="16" height="44" rx="8" fill="#ecfdf5"/>
    <rect x="262" y="-14" width="16" height="44" rx="8" fill="#ecfdf5"/>
    <rect x="30" y="26" width="120" height="14" rx="7" fill="#ecfdf5" opacity=".95"/>
    <rect x="30" y="48" width="70" height="10" rx="5" fill="#a7f3d0"/>

    <!-- itens -->
    <g>
      <rect x="30" y="112" width="44" height="44" rx="12" fill="#d1fae5"/>
      <path d="M41 135 l9 9 l15 -17" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="120" width="170" height="12" rx="6" fill="#1f2937"/>
      <rect x="90" y="142" width="110" height="9" rx="4.5" fill="#cbd5d1"/>
      <rect x="262" y="124" width="40" height="22" rx="11" fill="#d1fae5"/>
    </g>
    <g transform="translate(0 78)">
      <rect x="30" y="112" width="44" height="44" rx="12" fill="#d1fae5"/>
      <path d="M41 135 l9 9 l15 -17" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="120" width="150" height="12" rx="6" fill="#1f2937"/>
      <rect x="90" y="142" width="124" height="9" rx="4.5" fill="#cbd5d1"/>
      <rect x="262" y="124" width="40" height="22" rx="11" fill="#d1fae5"/>
    </g>
    <g transform="translate(0 156)">
      <rect x="30" y="112" width="44" height="44" rx="12" fill="#d1fae5"/>
      <path d="M41 135 l9 9 l15 -17" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="90" y="120" width="180" height="12" rx="6" fill="#1f2937"/>
      <rect x="90" y="142" width="96" height="9" rx="4.5" fill="#cbd5d1"/>
      <rect x="262" y="124" width="40" height="22" rx="11" fill="#d1fae5"/>
    </g>
    <!-- item pendente com aviso -->
    <g transform="translate(0 234)">
      <rect x="30" y="112" width="44" height="44" rx="12" fill="#fef3c7"/>
      <circle cx="52" cy="134" r="11" fill="none" stroke="#d97706" stroke-width="5"/>
      <path d="M52 127 v8 l5 3" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
      <rect x="90" y="120" width="140" height="12" rx="6" fill="#1f2937"/>
      <rect x="90" y="142" width="84" height="9" rx="4.5" fill="#cbd5d1"/>
      <rect x="250" y="124" width="52" height="22" rx="11" fill="#fde68a"/>
    </g>
  </g>

  <!-- engrenagem -->
  <g transform="translate(1040 470)" filter="url(#sh)">
    <g fill="#34d399">
      <rect x="-14" y="-78" width="28" height="30" rx="6"/>
      <rect x="-14" y="48" width="28" height="30" rx="6"/>
      <rect x="-78" y="-14" width="30" height="28" rx="6"/>
      <rect x="48" y="-14" width="30" height="28" rx="6"/>
      <rect x="-14" y="-78" width="28" height="30" rx="6" transform="rotate(45)"/>
      <rect x="-14" y="48" width="28" height="30" rx="6" transform="rotate(45)"/>
      <rect x="-78" y="-14" width="30" height="28" rx="6" transform="rotate(45)"/>
      <rect x="48" y="-14" width="30" height="28" rx="6" transform="rotate(45)"/>
    </g>
    <circle r="58" fill="#34d399"/>
    <circle r="26" fill="#064e3b"/>
  </g>
</svg>
